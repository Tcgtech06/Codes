<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirupur AI - Introduction</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --bot-bubble: #1e293b;
            --user-bubble: #3b82f6;
            --accent: #3b82f6;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; justify-content: center; align-items: center;
        }
        .phone-container {
            width: 100%; max-width: 400px; height: 100vh; max-height: 800px;
            background: #0b1120;
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #1e293b;
        }
        .header {
            padding: 20px; text-align: center; border-bottom: 1px solid #1e293b;
            font-size: 1.2rem; font-weight: bold; background: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(10px); z-index: 10;
        }
        .chat-area {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }
        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 18px;
            font-size: 0.95rem; line-height: 1.4; opacity: 0; transform: translateY(10px);
            animation: fadeIn 0.4s forwards;
        }
        .message.bot {
            background-color: var(--bot-bubble); align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.user {
            background-color: var(--user-bubble); align-self: flex-end;
            border-bottom-right-radius: 4px; color: white;
        }
        .chips-container {
            padding: 20px; display: flex; flex-direction: column; gap: 10px;
            background: linear-gradient(transparent, #0b1120 20%);
        }
        .chip {
            background: #1e293b; border: 1px solid #334155;
            color: var(--text-color); padding: 12px 20px; border-radius: 20px;
            text-align: center; cursor: pointer; font-size: 0.95rem;
            transition: all 0.3s;
        }
        .chip:hover {
            background: #334155; border-color: #475569;
        }
        .start-btn {
            background: var(--accent); color: white; padding: 15px;
            border: none; border-radius: 25px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; text-align: center; display: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .start-btn:hover {
            transform: scale(1.05); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.7);
        }
        
        /* Typing indicator */
        .typing {
            display: flex; gap: 5px; padding: 15px 20px;
            background-color: var(--bot-bubble); border-radius: 18px;
            border-bottom-left-radius: 4px; width: fit-content;
        }
        .typing span {
            width: 8px; height: 8px; background: #94a3b8; border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">Tirupur AI ✨</div>
    <div class="chat-area" id="chatArea">
        <!-- Initial typing indicator -->
        <div class="typing" id="initialTyping">
            <span></span><span></span><span></span>
        </div>
    </div>
    
    <div class="chips-container" id="chipsContainer" style="display: none;">
        <div class="chip" onclick="selectOption('Nee enna ellam pannuva?')">🚀 Nee enna ellam pannuva?</div>
        <div class="chip" onclick="selectOption('Oru sample kattu')">💡 Oru sample kattu</div>
        <button class="start-btn" id="startBtn" onclick="startApp()">Start Real Chat 💬</button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const initialTyping = document.getElementById('initialTyping');
    const chipsContainer = document.getElementById('chipsContainer');
    const startBtn = document.getElementById('startBtn');
    
    // Step 1: Initial Bot Welcome Message
    setTimeout(() => {
        initialTyping.style.display = 'none';
        addMessage('Vanakkam Thala! 👋 Naan thaan Tirupur AI. Unga personal smart assistant.', 'bot');
        
        setTimeout(() => {
            chipsContainer.style.display = 'flex';
            chipsContainer.style.animation = 'fadeIn 0.5s forwards';
        }, 800);
    }, 2000);

    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = text;
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing';
        typingDiv.id = 'tempTyping';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        chatArea.appendChild(typingDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
        return typingDiv;
    }

    function selectOption(text) {
        // Hide chips
        document.querySelectorAll('.chip').forEach(c => c.style.display = 'none');
        
        // Add User message
        addMessage(text, 'user');
        
        // Show Bot typing
        const typing = showTyping();
        
        setTimeout(() => {
            typing.remove();
            
            if(text.includes('enna ellam')) {
                addMessage('Naan ungaluku ideas tharuven, content create panni tharuven, Tirupur business details solluven. Ellame easy ah panlam! 🔥', 'bot');
            } else {
                addMessage('Kandipa! "Tirupur la best briyani enga kedaikum?" nu kelunga, illa "Oru leave letter eluthi kudu" nu kelunga. Naan udane panni tharuven! ⚡', 'bot');
            }
            
            // Show Start Button
            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.style.animation = 'fadeIn 0.5s forwards';
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 1000);
            
        }, 2500);
    }
    
    function startApp() {
        alert("Boom! Main app kulla pogum (e.g. chat page)");
        // React Native la iruntha router.push('/index') nu tharuvom
    }
</script>

</body>
</html>
